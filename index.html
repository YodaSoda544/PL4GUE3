<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PL4GU3 V3</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body style="background:#050505;color:#fff;font-family:Inter">
<header style="background:#000;border-bottom:1px solid #222;padding:12px">
<div style="display:flex;justify-content:space-between;align-items:center">
<h1 style="color:#00FF88;font-weight:bold">PL4GU3</h1>
<div><span id="authUser" style="font-size:12px;color:#666"></span>
<button id="authBtn" onclick="toggleAuth()" style="background:#fff;color:#000;padding:8px 16px;border-radius:20px;font-weight:bold;font-size:12px">Login</button>
<button onclick="loadRoster()" style="background:#222;color:#999;padding:8px 16px;border-radius:20px;font-size:12px;margin-left:6px">Roster</button></div>
</div>
</header>
<div id="authModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:50;align-items:center;justify-content:center">
<div style="background:#111;border:1px solid #333;padding:20px;border-radius:16px;width:90%;max-width:320px">
<h3>Artist Login</h3>
<input id="authEmail" placeholder="Email" style="width:100%;padding:10px;margin:8px 0;background:#000;border:1px solid #333;border-radius:8px;color:#fff">
<input id="authPass" type="password" placeholder="Password" style="width:100%;padding:10px;margin:8px 0;background:#000;border:1px solid #333;border-radius:8px;color:#fff">
<button onclick="doSignup()" style="width:48%;padding:10px;background:#222;border-radius:8px">Sign Up</button>
<button onclick="doLogin()" style="width:48%;padding:10px;background:#00FF88;color:#000;border-radius:8px;font-weight:bold">Login</button>
<button onclick="toggleAuth()" style="width:100%;margin-top:10px;color:#666;font-size:12px">Close</button>
<p id="authMsg" style="color:#00FF88;font-size:12px;margin-top:10px"></p>
</div>
</div>
<div style="padding:20px;max-width:900px;margin:0 auto">
<div style="background:#00FF88/10;border:1px solid #00FF88/30;padding:12px;border-radius:12px;margin-bottom:16px">
<p style="font-size:11px;color:#00FF88;font-weight:bold">PASTE REAL SUPABASE URL (https://clyygth...supabase.co) + anon eyJ... from Settings → API → Legacy keys</p>
<div style="display:flex;gap:8px;margin-top:8px"><input id="supaUrl" placeholder="https://clyygth...supabase.co" style="flex:1;padding:8px;background:#000;border:1px solid #333;border-radius:8px;font-size:12px"><input id="supaKey" placeholder="eyJhbGcOi..." style="flex:1;padding:8px;background:#000;border:1px solid #333;border-radius:8px;font-size:12px"><button onclick="saveKeys()" style="background:#00FF88;color:#000;padding:8px 12px;border-radius:8px;font-weight:bold;font-size:12px">Save</button></div>
<p id="keyStatus" style="font-size:10px;color:#666;margin-top:6px">Must be real URL, not pl4gu3.supabase.co</p>
</div>
<input id="name" placeholder="Artist Name * Chaody" style="width:100%;padding:12px;background:#111;border:1px solid #333;border-radius:12px;margin-bottom:10px">
<input id="handle" placeholder="Handle * yoda" style="width:100%;padding:12px;background:#111;border:1px solid #333;border-radius:12px;margin-bottom:10px">
<div style="display:flex;gap:10px"><input id="city" placeholder="Johannesburg" style="flex:1;padding:12px;background:#111;border:1px solid #333;border-radius:12px"><select id="genre" style="flex:1;padding:12px;background:#111;border:1px solid #333;border-radius:12px"><option>Hip-hop</option><option>Amapiano</option><option>Afrobeat</option></select></div>
<textarea id="bio" placeholder="Bio test" style="width:100%;padding:12px;background:#111;border:1px solid #333;border-radius:12px;margin-top:10px;height:80px"></textarea>
<div style="margin-top:16px;background:#000;padding:12px;border-radius:12px;border:1px solid #222"><p>Playlist</p><input id="trackTitle" placeholder="My Name" style="width:100%;padding:10px;background:#111;border:1px solid #333;border-radius:8px;margin:6px 0"><input id="trackLink" placeholder="Spotify link" style="width:100%;padding:10px;background:#111;border:1px solid #333;border-radius:8px"><button onclick="addTrack()" style="width:100%;margin-top:8px;padding:10px;background:#222;border-radius:8px">+ Add to Playlist</button><div id="tracksList" style="margin-top:10px"></div></div>
<input id="spotify" placeholder="Spotify link" style="width:100%;padding:12px;background:#111;border:1px solid #333;border-radius:12px;margin-top:10px">
<button onclick="saveEPK()" style="width:100%;margin-top:20px;padding:16px;background:#00FF88;color:#000;font-weight:bold;border-radius:12px">Save & Publish Live →</button>
<p id="saveMsg" style="display:none;margin-top:12px;padding:12px;background:#00FF88/10;border:1px solid #00FF88/30;border-radius:12px;text-align:center;color:#00FF88"></p>
<div id="rosterBox" style="display:none;margin-top:20px;background:#111;border:1px solid #333;padding:16px;border-radius:16px"><h3>Roster</h3><div id="rosterList"></div></div>
</div>
<script>
let tracks=[],supa=null,currentUser=null;
function getKeys(){return{url:localStorage.getItem('pl4gu3_url')||document.getElementById('supaUrl').value,key:localStorage.getItem('pl4gu3_key')||document.getElementById('supaKey').value}}
function initSupa(){const {url,key}=getKeys();if(url&&key&&url.includes('supabase.co')){try{supa=window.supabase.createClient(url,key);document.getElementById('keyStatus').innerText='✅ Connected to '+url;checkUser()}catch(e){document.getElementById('keyStatus').innerText='❌ '+e.message}}}
function saveKeys(){const url=document.getElementById('supaUrl').value.trim();const key=document.getElementById('supaKey').value.trim();if(!url.includes('supabase.co')||!key.startsWith('eyJ')){alert('Paste REAL URL https://clyyg...supabase.co and anon key eyJ... from Settings → API → Legacy keys. You typed pl4gu3.supabase.co which is wrong');return}localStorage.setItem('pl4gu3_url',url);localStorage.setItem('pl4gu3_key',key);initSupa();alert('Saved! Now try Save & Publish')}
window.addEventListener('load',()=>{const u=localStorage.getItem('pl4gu3_url');const k=localStorage.getItem('pl4gu3_key');if(u)document.getElementById('supaUrl').value=u;if(k)document.getElementById('supaKey').value=k;initSupa()});
function toggleAuth(){const m=document.getElementById('authModal');m.style.display=m.style.display==='none'?'flex':'none'}
async function checkUser(){if(!supa)return;const {data}=await supa.auth.getUser();if(data.user){currentUser=data.user;document.getElementById('authUser').innerText=data.user.email;document.getElementById('authBtn').innerText='Logout';document.getElementById('authBtn').onclick=doLogout}else{currentUser=null}}
async function doSignup(){const e=document.getElementById('authEmail').value;const p=document.getElementById('authPass').value;const {error}=await supa.auth.signUp({email:e,password:p});document.getElementById('authMsg').innerText=error?error.message:'✅ Check email then Login';checkUser()}
async function doLogin(){const e=document.getElementById('authEmail').value;const p=document.getElementById('authPass').value;const {error}=await supa.auth.signInWithPassword({email:e,password:p});document.getElementById('authMsg').innerText=error?error.message:'✅ Logged in';if(!error){toggleAuth();checkUser()}}
async function doLogout(){await supa.auth.signOut();checkUser();document.getElementById('authBtn').innerText='Login';document.getElementById('authBtn').onclick=toggleAuth}
function addTrack(){const t=document.getElementById('trackTitle').value;const l=document.getElementById('trackLink').value;if(!t)return;tracks.push({title:t,link:l});document.getElementById('tracksList').innerHTML=tracks.map(x=>`<div style="background:#111;padding:8px;border-radius:8px;margin:4px 0">🎵 ${x.title}</div>`).join('');document.getElementById('trackTitle').value='';document.getElementById('trackLink').value=''}
async function saveEPK(){if(!supa){alert('Save correct keys first');return}const h=document.getElementById('handle').value.toLowerCase().replace(/\s+/g,'');const n=document.getElementById('name').value;if(!h||!n){alert('Name + Handle needed');return}const payload={handle:h,name:n,city:document.getElementById('city').value,genre:document.getElementById('genre').value,bio:document.getElementById('bio').value,spotify:document.getElementById('spotify').value,tracks:tracks,user_id:currentUser?currentUser.id:null};try{const {error}=await supa.from('artists').upsert(payload,{onConflict:'handle'});if(error)throw error;const link=location.origin+'/?p='+h;document.getElementById('saveMsg').style.display='block';document.getElementById('saveMsg').innerHTML=`✅ LIVE! <a href='${link}' target='_blank'>${link}</a>`}catch(e){alert('Failed: '+e.message+'\n\nFIX: Go Supabase → SQL Editor → New Query → Run:\ncreate policy "allow all" on artists for all using (true) with check (true);')}}
async function loadRoster(){if(!supa)initSupa();const {data}=await supa.from('artists').select('handle,name,city').limit(20);document.getElementById('rosterBox').style.display='block';document.getElementById('rosterList').innerHTML=data.map(a=>`<div style="display:flex;justify-content:space-between;background:#000;padding:10px;border-radius:8px;margin:4px 0"><span>${a.name}</span><a href='?p=${a.handle}' style="color:#00FF88">/${a.handle}</a></div>`).join('')}
</script>
</body>
</html>
